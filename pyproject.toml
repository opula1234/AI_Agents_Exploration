[project]
name = "ai-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "opula1234", email = "balajioropula@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.33",
    "fastapi[standard]>=0.162.0",
    "gradio>=6.31.0",
